name: warkop_doa_ambu
description: Sistem POS kasir offline-first untuk Warkop Doa Ambu.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  camera: ^0.11.0
  crypto: ^3.0.7
  excel: ^4.0.6
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.0
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  image: ^4.2.0
  image_picker: ^1.1.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  supabase_flutter: ^2.18.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - .env

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F5EEDB"
  adaptive_icon_foreground: "assets/icon/icon.png"

